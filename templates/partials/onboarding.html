      <!-- =========================================================
           BIENVENIDA RÁPIDA EN 2 PASOS (SOLO USUARIOS NUEVOS)
           ========================================================= -->
      <section id="view-onboarding" class="app-view d-none">
        <div class="duo-card onboarding-shell mx-auto p-4 p-sm-5 my-2 my-md-4">

          <!-- Paso 1: Saludo y propuesta en 1 frase -->
          <div id="onboarding-step-1" class="text-center">
            <div class="onboarding-step-dots mb-3" aria-label="Paso 1 de 2">
              <span class="onboarding-step-dot is-active"></span>
              <span class="onboarding-step-dot"></span>
            </div>
            <div class="small fw-bold text-secondary mb-3">Paso 1 de 2</div>

            <div class="hero-emblem mx-auto mb-3" aria-hidden="true">
              <i class="bi bi-compass-fill"></i>
            </div>
            <h1 id="onboarding-welcome-title" class="h2 fw-black mb-3">¡Hola, Estudiante!</h1>
            <p class="text-secondary fs-6 mx-auto mb-4" style="max-width: 440px; line-height: 1.55;">
              Resuelve en tu cuaderno, sube tu foto y la IA te guía paso a paso sin regalarte la respuesta.
            </p>

            <button
              type="button"
              id="btn-onboarding-continue"
              class="btn btn-duo btn-duo-green btn-lg w-100 py-3"
            >
              Continuar
            </button>
          </div>

          <!-- Paso 2: Elección directa de materia -->
          <div id="onboarding-step-2" class="d-none">
            <div class="text-center mb-3">
              <div class="onboarding-step-dots mb-3" aria-label="Paso 2 de 2">
                <span class="onboarding-step-dot is-done"></span>
                <span class="onboarding-step-dot is-active"></span>
              </div>
              <div class="small fw-bold text-secondary mb-2">Paso 2 de 2</div>
              <h2 class="h3 fw-black mb-1">¿Qué materia quieres estudiar hoy?</h2>
              <p class="small text-secondary mb-0">
                Elige una asignatura para comenzar ahora mismo.
              </p>
            </div>

            <div id="onboarding-subjects-grid" class="onboarding-subjects-grid my-3"></div>

            <div class="text-center mt-2">
              <button
                type="button"
                id="btn-onboarding-explore-all"
                class="btn btn-link text-secondary fw-semibold text-decoration-none py-1"
              >
                Explorar todas las materias
              </button>
            </div>
          </div>

        </div>
      </section>
